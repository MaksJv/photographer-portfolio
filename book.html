<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Photo Session</title>
  <link rel="shortcut icon" href="img/logo.webp" type="image/x-icon" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/photo-sessions.css" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.css" />
</head>
<body>
  <header class="header">
    <div class="header__background">
      <div class="header__container container">
        <nav data-include="header-nav.partial.html"></nav>
        <section class="book-header">
          <p class="book-subtitle">Let’s create something magical together</p>
        </section>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="book-form-section">
      <p class="container-book">Book a Photo Session</p>
      <form class="book-form" action="http://localhost:8080/api/bookings" method="POST">
        <label>
          Your Name
          <input type="text" name="name" placeholder="John Doe" required />
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com" required />
        </label>
        <label>
          Phone Number
          <input type="tel" id="phone" name="phone" required />
          <div id="phone-error" class="error-message" style="display: none; color: red;">
            Please enter a valid phone number.
          </div>
        </label>
        <label>
          Preferred Date
          <input type="text" id="datePicker" name="date" placeholder="Select date" required />
        </label>
        <label>
          Preferred Time
          <div class="time-options">
            <label class="time-option" id="time-9-container">
              <input type="radio" name="time" value="09:00" id="time-9" required>
              <span>09:00</span>
            </label>
            <label class="time-option" id="time-14-container">
              <input type="radio" name="time" value="14:00" id="time-14" required>
              <span>14:00</span>
            </label>
          </div>
        </label>
        <label>
          Select photosession type
          <select name="photosession_type" id="photosession-type" class="custom-select" required>
            <option value="" disabled selected>Select photosession type...</option>
          </select>
        </label>
        <label>
          Message
          <textarea name="message" placeholder="Tell me more..."></textarea>
        </label>
        <input type="hidden" name="_captcha" value="false" />
        <button type="submit" class="book-submit-button">Submit</button>
      </form>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <footer data-include="footer.partial.html"></footer>

  <script src="https://unpkg.com/html-data-include@3.3.3/html-data-include.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pl.js"></script>

  <script>
    let availableDates = [];

    async function fetchAvailableDates() {
  try {
    const response = await fetch("http://localhost:8080/api/bookings/available-dates");
    const allDates = await response.json();
    
    const filteredDates = [];

    for (const date of allDates) {
      const checkResponse = await fetch(`http://localhost:8080/api/bookings/check-availability?preferredDate=${date}`);
      if (checkResponse.ok) {
        filteredDates.push(date);
      } else {
        console.log(`Date ${date} has no available times.`);
      }
    }

    availableDates = filteredDates;
    console.log("Filtered available dates:", availableDates);
  } catch (err) {
    console.error("Error fetching available dates:", err);
  }
}

  
    async function fetchPhotosessionTypes() {
      try {
        const response = await fetch("http://localhost:8080/api/photosession-types");
        if (!response.ok) throw new Error("Failed to load types");
  
        const types = await response.json();
        const select = document.getElementById("photosession-type");
  
        types.forEach(type => {
          const option = document.createElement("option");
          option.value = type.id;
          option.textContent = type.name;
          select.appendChild(option);
        });
      } catch (err) {
        console.error("Error loading photosession types:", err);
      }
    }
  
    function checkAvailability() {
      const selectedDate = document.querySelector('input[name="date"]').value;
      console.log("Selected date:", selectedDate);
    }
  
    document.addEventListener("DOMContentLoaded", async function () {
      await fetchAvailableDates();
      await fetchPhotosessionTypes();
  
      flatpickr("#datePicker", {
        dateFormat: "Y-m-d",
        minDate: "today",
        locale: "pl",
        onOpen: async function () {
          await fetchAvailableDates();
          this.redraw();
        },
        onDayCreate: function (dObj, dStr, fp, dayElem) {
          const date = dayElem.dateObj.toISOString().split("T")[0];
          if (availableDates.includes(date)) {
            dayElem.classList.add("available-day");
            dayElem.classList.remove("flatpickr-disabled");
          } else {
            dayElem.classList.add("unavailable-day");
            dayElem.classList.add("flatpickr-disabled");
          }
        }
      });

      const form = document.querySelector(".book-form");

    form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const phoneError = document.getElementById("phone-error");

  if (!iti.isValidNumber()) {
    phoneError.style.display = "block";
    return;
  } else {
    phoneError.style.display = "none";
  }

  const formData = new FormData(form);

  const payload = {
    name: formData.get("name"),
    email: formData.get("email"),
    date: formData.get("date"),
    time: formData.get("time"),
    photosessionTypeId: parseInt(formData.get("photosession_type")),
    message: formData.get("message"),
    phone: iti.getNumber()
  };

  try {
    const response = await fetch("http://localhost:8080/api/bookings", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (response.ok) {
      showToast("Your booking was submitted successfully! ✅", "success");
      form.reset();

      resetTimeOption("time-9");
      resetTimeOption("time-14");
    } else {
      showToast("Something went wrong. ❌", "error");
    }
  } catch (error) {
    console.error("Submit error:", error);
    showToast("Failed to connect to the server. ❌", "error");
  }
});


    function showToast(message, type = "success") {
  const toast = document.getElementById("toast");
  if (!toast) return;

  toast.className = "toast";
  toast.textContent = message;

  if (type === "success") {
    toast.classList.add("success");
  } else if (type === "error") {
    toast.classList.add("error");
  }

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => {
      toast.classList.remove("success", "error");
    }, 300);
  }, 3000);
}



  
      document.querySelector('input[name="date"]').addEventListener('change', checkAvailability);
      
  document.querySelector('input[name="date"]').addEventListener("change", async function () {
    const selectedDate = this.value;

  
  document.querySelectorAll('input[name="time"]').forEach(input => {
    input.checked = false;
  });
  
    try {
      const response = await fetch(`http://localhost:8080/api/bookings/check-availability?preferredDate=${selectedDate}`);
      if (response.ok) {
        const availableTimes = await response.json();
  
        resetTimeOption("time-9");
        resetTimeOption("time-14");
  
        if (!availableTimes.includes("09:00")) {
          disableTimeOption("time-9");
        }
        if (!availableTimes.includes("14:00")) {
          disableTimeOption("time-14");
        }
  
        if (availableTimes.length === 0) {
          showToast("No hours available for this date. Please select another day.", false);
        }
      } else {
        const errorMessage = await response.text();
        showToast(errorMessage, false);
      }
    } catch (err) {
      console.error("Error checking availability", err);
      showToast("Something went wrong. Please try again.", false);
    }
  });

  const input = document.querySelector("#phone");

  const iti = window.intlTelInput(input, {
    preferredCountries: ["ua", "pl", "us", "gb"],
    initialCountry: "auto",
    geoIpLookup: function (success, failure) {
      fetch("https://ipapi.co/json")
        .then((res) => res.json())
        .then((data) => success(data.country_code))
        .catch(() => success("UA"));
    },
    utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/utils.js",
  });

  const phoneError = document.getElementById("phone-error");
  const form1 = document.querySelector(".book-form"); // Це твоя форма
form1.addEventListener("submit", function (e) {     // Було form.addEventListener...
  if (!iti.isValidNumber()) {
    phoneError.style.display = "block";
    return;
  } else {
    input.value = iti.getNumber(); // Приводимо до міжнародного формату
  }
  
});

  
  function disableTimeOption(timeId) {
  const timeInput = document.getElementById(timeId);
  const container = document.getElementById(`${timeId}-container`);
  if (timeInput && container) {
    timeInput.disabled = true;
    container.classList.add("disabled-time-option");
  }
}

function resetTimeOption(timeId) {
  const timeInput = document.getElementById(timeId);
  const container = document.getElementById(`${timeId}-container`);
  if (timeInput && container) {
    timeInput.disabled = false;
    container.classList.remove("disabled-time-option");
  }
}


    flatpickr("#datePicker", {
  async onOpen() {
    await fetchAvailableDates();
    this.redraw();
  },

  disable: [
    function(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const formatted = `${year}-${month}-${day}`;
      return !availableDates.includes(formatted);
    }
  ],

  onDayCreate: function(dObj, dStr, fp, dayElem) {
    const date = dayElem.dateObj;
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const formatted = `${year}-${month}-${day}`;

    if (availableDates.includes(formatted)) {
      dayElem.classList.add("available-day");
    }
  },

  minDate: "today",
});
    });
</script>
<script type="module" src="./js/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/utils.js"></script>

</body>
</html>
